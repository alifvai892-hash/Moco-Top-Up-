<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোকো স্টোর - Moco Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="event-header">
        <h2>মোকো স্টোর (BD)</h2>
        <p>ফ্রি ফায়ার ডায়মন্ড টপ আপ</p>
    </div>

    <div class="section-title">১. সিলেক্ট রিচার্জ</div>
    <div class="items-grid" id="itemsContainer">
        <div class="item-card" onclick="selectItem(this, '25 Diamonds', '20 TK')">
            <h4>25 Diamond</h4>
            <p>20 TK</p>
        </div>
        <div class="item-card" onclick="selectItem(this, '115 Diamonds', '77 TK')">
            <h4>115 Diamond</h4>
            <p>77 TK</p>
        </div>
        <div class="item-card" onclick="selectItem(this, '240 Diamonds', '158 TK')">
            <h4>240 Diamond</h4>
            <p>158 TK</p>
        </div>
    </div>

    <div class="section-title">২. Account Info</div>
    <div class="input-group">
        <label>Free Fire Player ID *</label>
        <input type="text" class="input-field" placeholder="Enter Player ID">
    </div>

    <div class="section-title">৩. Payment Methods</div>
    <div class="payment-methods">
        <div class="payment-option selected" onclick="selectPayment(this)">
            <h4>Wallet Pay</h4>
            <p>Balance: 0 TK</p>
        </div>
        <div class="payment-option" onclick="selectPayment(this)">
            <h4>Instant Pay</h4>
            <p>bKash</p>
        </div>
    </div>

    <button class="action-btn">BUY NOW</button>

    <script src="script.js"></script>
</body>
</html>
